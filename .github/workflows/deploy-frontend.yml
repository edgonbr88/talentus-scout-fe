name: Deploy Frontend to Production (Cloud Run)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: project-3f3415b6-8b35-4d04-be4
  REGION: southamerica-east1
  WIF_PROVIDER: projects/994142432241/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  WIF_SERVICE_ACCOUNT: github-actions-sa@project-3f3415b6-8b35-4d04-be4.iam.gserviceaccount.com
  REGISTRY_HOST: southamerica-east1-docker.pkg.dev
  IMAGE_NAME: southamerica-east1-docker.pkg.dev/project-3f3415b6-8b35-4d04-be4/talentus-containers/frontend

jobs:
  deploy-frontend:
    name: Build & Deploy Frontend (Angular 18+ SSR)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies & Build Angular SSR Production Bundle
        run: |
          npm ci --prefer-offline
          npm run build -- --configuration=production

      - name: Authenticate to Google Cloud via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGISTRY_HOST }} --quiet

      - name: Build and Push Frontend Image
        run: |
          docker build -f Dockerfile.prod -t "${{ env.IMAGE_NAME }}:${{ github.sha }}" -t "${{ env.IMAGE_NAME }}:latest" .
          docker push "${{ env.IMAGE_NAME }}:${{ github.sha }}"
          docker push "${{ env.IMAGE_NAME }}:latest"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy talentus-frontend-prod \
            --image="${{ env.IMAGE_NAME }}:${{ github.sha }}" \
            --region="${{ env.REGION }}" \
            --platform=managed
